name: security-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  opa-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2
        with:
          version: 1.19.1

      - name: policy syntax + tests + fixture gates
        run: ./scripts/gate.sh

  pdpa-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install ripgrep + babashka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && sudo ./install

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nurazhardotcom/pdpa-sg-clj
          path: pdpa-sg-clj

      - name: scan repo for Singapore PII / secrets (NRIC, tokens)
        run: |
          mv "$GITHUB_WORKSPACE/pdpa-sg-clj" /tmp/pdpa-sg-clj
          output=$(cd /tmp/pdpa-sg-clj && bb scan "$GITHUB_WORKSPACE")
          echo "$output"
          echo "$output" | grep -q "clean? true"

  supply-chain-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2
        with:
          version: 1.19.1

      - name: verify gate before signing anything
        run: ./scripts/gate.sh

      - name: bundle policy + fixtures
        run: |
          tar -czf policy-bundle-${{ github.sha }}.tar.gz policy/ fixtures/ scripts/
          sha256sum policy-bundle-${{ github.sha }}.tar.gz > checksums.txt
          cat checksums.txt

      - name: generate build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: policy-bundle-${{ github.sha }}.tar.gz
          subject_name: policy-bundle

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign checksums keyless (OIDC — no stored keys)
        run: cosign sign-blob --yes checksums.txt --bundle checksums.bundle

      - name: verify signature back
        run: cosign verify-blob --insecure-ignore-tlog --bundle checksums.bundle --certificate-identity-regexp '^https://github.com/nurazhardotcom/' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt

      - name: publish signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.sha }}
          path: |
            policy-bundle-${{ github.sha }}.tar.gz
            checksums.txt
            checksums.bundle
