name: security-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  opa-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2
        with:
          version: 1.21.0

      - name: install Babashka for native service tests
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install

      - name: native policy syntax, tests, and fixture gates
        run: ./scripts/gate.sh

      - name: native PEP/PDP service tests
        run: bb test

  wasm-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2
        with:
          version: 1.21.0

      - name: install ripgrep for the build coherence check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: install pinned Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: compile the production policy to Wasm
        run: ./scripts/build-wasm.sh

      - name: verify native/Wasm exact parity and fail-closed results
        run: npm run verify:wasm

  pdpa-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install ripgrep + babashka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && sudo ./install

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nurazhardotcom/pdpa-sg-clj
          path: pdpa-sg-clj

      - name: scan repo for Singapore PII / secrets (NRIC, tokens)
        run: |
          mv "$GITHUB_WORKSPACE/pdpa-sg-clj" /tmp/pdpa-sg-clj
          output=$(cd /tmp/pdpa-sg-clj && bb scan "$GITHUB_WORKSPACE")
          echo "$output"
          echo "$output" | grep -q "clean? true"

  supply-chain-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2
        with:
          version: 1.21.0

      - name: install ripgrep for the build coherence check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: install pinned Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: verify native gate before signing anything
        run: ./scripts/gate.sh

      - name: compile and verify the production Wasm
        run: |
          ./scripts/build-wasm.sh
          npm run verify:wasm

      - name: create a source archive (not an OPA bundle)
        run: |
          git archive --format=tar.gz \
            --prefix=identity-policy-source/ \
            --output="identity-policy-source-${{ github.sha }}.tar.gz" HEAD

      - name: hash source, OPA bundle, raw Wasm, and manifest
        run: |
          sha256sum \
            "identity-policy-source-${{ github.sha }}.tar.gz" \
            build/wasm/policy-bundle.tar.gz \
            build/wasm/policy.wasm \
            build/wasm/manifest.json \
            build/wasm/checksums.txt \
            > checksums.txt
          cat checksums.txt

      - name: generate build provenance for source and Wasm artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            identity-policy-source-${{ github.sha }}.tar.gz
            build/wasm/policy-bundle.tar.gz
            build/wasm/policy.wasm
            build/wasm/manifest.json
          subject-name: identity-policy-as-code

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign checksums keyless (OIDC — no stored keys)
        run: cosign sign-blob --yes checksums.txt --bundle checksums.bundle

      - name: verify signature back
        run: cosign verify-blob --bundle checksums.bundle --certificate-identity-regexp '^https://github.com/nurazhardotcom/' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt

      - name: publish signed source and Wasm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            identity-policy-source-${{ github.sha }}.tar.gz
            build/wasm/policy-bundle.tar.gz
            build/wasm/policy.wasm
            build/wasm/manifest.json
            build/wasm/checksums.txt
            checksums.txt
            checksums.bundle
